name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The [dev,test] install pulls torch/tensorflow plus the bundled CUDA
      # libs (~10GB), which overruns the runner's default free space.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned: these were unpinned, so a new release of any of them changed
          # the result of a check without this repo changing. That matters most
          # for black, whose formatting differs between majors.
          pip install black==23.11.0 isort==5.13.2 flake8==7.3.0 mypy==1.20.2 \
                      bandit==1.8.6 safety==3.6.2
          pip install -e ".[dev,test]"

      # BLOCKING. These are the flake8 classes that indicate real defects rather
      # than style: E9 syntax/indentation errors, F63 bad comparisons, F7
      # misplaced statements and F82 undefined names. Undefined names are
      # guaranteed NameErrors at runtime, and there were 17 of them behind the
      # `|| true` that used to cover this step.
      - name: Run Flake8 (errors -- blocking)
        run: flake8 CancerGenomicsSuite/ --select=E9,F63,F7,F82 --count

      # ADVISORY, and genuinely so -- not a check dressed up as one. The tree
      # currently carries ~30k style findings (mostly W293 trailing whitespace
      # and E501 long lines) and 278 files that black would reformat. Gating on
      # any of that today would just block every pull request, and clearing it
      # is a formatting sweep that should land on its own rather than riding
      # along with unrelated changes. The step names say "advisory" so a green
      # tick here is not mistaken for a clean tree.
      - name: Run Flake8 (style -- advisory)
        run: flake8 CancerGenomicsSuite/ --count || true

      - name: Run Black (advisory)
        run: black --check --diff CancerGenomicsSuite/ || true

      - name: Run isort (advisory)
        run: isort --check-only --diff CancerGenomicsSuite/ || true

      - name: Run MyPy (advisory)
        run: mypy CancerGenomicsSuite/ || true

      # BLOCKING at high severity. Anything bandit rates high is worth stopping
      # for; the report is still written for the artifact upload either way.
      - name: Run Bandit (security linting)
        run: |
          bandit -r CancerGenomicsSuite/ -f json -o bandit-report.json || true
          bandit -r CancerGenomicsSuite/ -lll

      - name: Run Safety (dependency vulnerability check -- advisory)
        run: safety check --json --output safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The [dev,test] install pulls torch/tensorflow plus the bundled CUDA
      # libs (~10GB), which overruns the runner's default free space.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      # BLOCKING. This was `|| true`, which made the whole job incapable of
      # failing: the suite passes today (189 passed, 6 skipped), so every green
      # tick was accurate by luck rather than by check, and the next broken test
      # would have gone unreported.
      - name: Run unit tests
        run: |
          pytest CancerGenomicsSuite/tests/ -m unit --cov=CancerGenomicsSuite --cov-report=xml --cov-report=html --junitxml=test-results-unit.xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        # Runs even when the tests above fail so partial coverage is still
        # visible; `file` is not a valid input for v5, which warned on every run.
        if: always()
        with:
          files: ./coverage.xml
          flags: unit
          name: coverage-3.11-unit

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-3.11-unit
          path: |
            test-results-*.xml
            htmlcov/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # This step was named "Run Trivy vulnerability scanner" but its body was
      # `echo "Security scan baseline check completed."`. It ran no scanner at
      # all and could not fail, so the "Security Scan" check reported green
      # regardless of the tree. It now actually scans the dependency manifests.
      #
      # Run via the official image rather than trivy-action, matching the choice
      # already made and documented in security.yml: the action's v0.33.x line
      # has intermittently failed to bootstrap its own binary.
      #
      # --exit-code 0 for now, as security.yml also does. This has never run, so
      # the finding count is unknown; turning it into a gate should follow a
      # first run that establishes the baseline rather than being asserted here.
      - name: Run Trivy vulnerability scanner (filesystem, advisory)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:0.58.1 fs /workspace \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format table

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Dockerfile pulls in torch/tensorflow/transformers/opencv etc.; the
      # runner's default free space plus a mode=max layer cache has been
      # enough to hit "no space left on device" mid-build.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: cancer-genomics-analysis-suite:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Test Docker image
        run: |
          docker run --rm cancer-genomics-analysis-suite:latest python -c "import CancerGenomicsSuite; print('Import successful')"

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The [dev,test] install pulls torch/tensorflow plus the bundled CUDA
      # libs (~10GB), which overruns the runner's default free space.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run performance tests
        run: |
          # --no-cov overrides the --cov-fail-under=10 in pyproject's addopts:
          # a benchmark run only selects the perf-marked tests, so its coverage
          # is ~6% and would fail the global gate even though nothing is wrong.
          pytest CancerGenomicsSuite/tests/ -m performance --no-cov --benchmark-only --benchmark-save=performance-baseline

      - name: Upload performance results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-results
          path: .benchmarks/

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, security-scan, build, docker-build]
    if: always()
    steps:
      - name: Notify on success
        if: ${{ needs.lint-and-format.result == 'success' && needs.test.result == 'success' && needs.security-scan.result == 'success' && needs.build.result == 'success' && needs.docker-build.result == 'success' }}
        run: |
          echo "✅ All CI checks passed successfully!"

      - name: Notify on failure
        if: ${{ needs.lint-and-format.result == 'failure' || needs.test.result == 'failure' || needs.security-scan.result == 'failure' || needs.build.result == 'failure' || needs.docker-build.result == 'failure' }}
        run: |
          echo "❌ Some CI checks failed. Please check the logs."
          exit 1
