# Alembic configuration for the application's ORM migrations.
#
# Run from this directory (CancerGenomicsSuite/), as INTEGRATION_UPDATES.md
# describes:
#
#   alembic upgrade head
#
# Before this file existed that command could not run at all -- Alembic had no
# config to find, so it stopped with "No config file 'alembic.ini' found".

[alembic]
# %(here)s is this file's directory, so the scripts are found whatever the
# current working directory is.
script_location = %(here)s/app/orm/migrations

# Deliberately empty. env.py takes the URL from DATABASE_URL, or from
# settings.get_database_url() -- the same value the application connects with --
# so migrations cannot drift onto a different database than the app, and no
# connection string or credential is committed here.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
