# Secret values for the chart, kept out of the repository.
#
# Copy to values-secrets.yaml (gitignored) and fill in, then layer it last so it
# overrides whichever environment file you are using:
#
#   helm install cancer-genomics . \
#     -f values-production.yaml \
#     -f values-secrets.yaml
#
# Or pass them inline instead, which avoids a file on disk entirely:
#
#   helm install cancer-genomics . -f values-production.yaml \
#     --set secrets.app.data.SECRET_KEY="$(openssl rand -base64 48)" \
#     --set secrets.app.data.JWT_SECRET_KEY="$(openssl rand -base64 48)" \
#     --set secrets.database.data.POSTGRES_PASSWORD="$(openssl rand -base64 32)"
#
# The committed values files carry "" for all of these. SECRET_KEY,
# JWT_SECRET_KEY and POSTGRES_PASSWORD are wrapped in Helm's `required`, so an
# install that leaves them empty stops with a message naming the missing value
# rather than rendering a release with a blank or well-known credential.
#
# Generate each with:
#
#   openssl rand -base64 48
#
secrets:
  app:
    data:
      # Flask session signing key. Holding it means being able to forge a session.
      SECRET_KEY: ""
      # JWT signing key. Holding it means being able to mint a token for any user.
      JWT_SECRET_KEY: ""

  database:
    data:
      # Must match postgresql.auth.password below.
      POSTGRES_PASSWORD: ""

  # Optional. Leave empty unless the deployment calls these APIs with a key.
  apis:
    data:
      ENSEMBL_API_KEY: ""
      UNIPROT_API_KEY: ""
      CLINVAR_API_KEY: ""

# Bitnami subchart credentials. Left empty, these subcharts generate a random
# password on first install and reuse it on upgrade; set them explicitly if you
# need to know the value or are pointing at an external instance.
postgresql:
  auth:
    postgresPassword: ""
    password: ""

redis:
  auth:
    password: ""
