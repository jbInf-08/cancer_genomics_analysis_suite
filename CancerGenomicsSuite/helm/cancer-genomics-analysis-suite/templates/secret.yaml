{{- if .Values.secrets.app.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cancer-genomics-analysis-suite.secretName" . }}
  labels:
    {{- include "cancer-genomics-analysis-suite.labels" . | nindent 4 }}
type: Opaque
data:
  # `required` rather than a default. The values files used to carry working
  # keys, and "CHANGE THESE IN PRODUCTION" does not stop an install that never
  # changed them -- the chart rendered and the release came up signing tokens
  # with a string from the repository. Now the install stops instead.
  #
  # Supply them at install time, e.g.:
  #   helm install ... --set secrets.app.data.SECRET_KEY="$(openssl rand -base64 48)"
  # or with a local, uncommitted values file -- see values-secrets.example.yaml.
  secret-key: {{ required "secrets.app.data.SECRET_KEY must be set; generate one with: openssl rand -base64 48" .Values.secrets.app.data.SECRET_KEY | b64enc }}
  jwt-secret-key: {{ required "secrets.app.data.JWT_SECRET_KEY must be set; generate one with: openssl rand -base64 48" .Values.secrets.app.data.JWT_SECRET_KEY | b64enc }}
  {{- if .Values.secrets.apis.create }}
  ensembl-api-key: {{ .Values.secrets.apis.data.ENSEMBL_API_KEY | b64enc }}
  uniprot-api-key: {{ .Values.secrets.apis.data.UNIPROT_API_KEY | b64enc }}
  clinvar-api-key: {{ .Values.secrets.apis.data.CLINVAR_API_KEY | b64enc }}
  {{- end }}
{{- end }}
---
{{- if .Values.secrets.database.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cancer-genomics-analysis-suite.postgresql.secretName" . }}
  labels:
    {{- include "cancer-genomics-analysis-suite.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-user: {{ .Values.secrets.database.data.POSTGRES_USER | b64enc }}
  postgres-password: {{ required "secrets.database.data.POSTGRES_PASSWORD must be set; generate one with: openssl rand -base64 32" .Values.secrets.database.data.POSTGRES_PASSWORD | b64enc }}
  postgres-db: {{ .Values.secrets.database.data.POSTGRES_DB | b64enc }}
{{- end }}
