apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cancer-genomics-ingress
  namespace: cancer-genomics
  labels:
    app: cancer-genomics-analysis-suite
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # Security headers are set in the nginx ConfigMap rather than through a
    # configuration-snippet: snippets allow arbitrary nginx configuration from
    # an Ingress object (CVE-2021-25742).
    
    # Cert-manager for SSL certificates
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Monitoring
    prometheus.io/scrape: "true"
    prometheus.io/port: "10254"
    prometheus.io/path: "/metrics"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cancer-genomics.yourdomain.com  # Change to your domain
    secretName: cancer-genomics-tls
  rules:
  - host: cancer-genomics.yourdomain.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80
---
# Alternative: Ingress for API-only access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cancer-genomics-api-ingress
  namespace: cancer-genomics
  labels:
    app: cancer-genomics-analysis-suite
    component: api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # The controller's own CORS handling, replacing a configuration-snippet
    # (CVE-2021-25742). Values are carried across unchanged -- note that
    # allow-origin is "*" while allow-headers includes Authorization, which is
    # worth revisiting separately, but tightening it here would change who can
    # call the API.
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.cancer-genomics.yourdomain.com  # Change to your API domain
    secretName: cancer-genomics-api-tls
  rules:
  - host: api.cancer-genomics.yourdomain.com  # Change to your API domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cancer-genomics-web
            port:
              number: 8050
