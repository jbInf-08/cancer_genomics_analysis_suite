apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cancer-genomics-ingress
  namespace: cancer-genomics
  labels:
    app: cancer-genomics-analysis-suite
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # Security headers are set in the nginx ConfigMap rather than through a
    # configuration-snippet: snippets allow arbitrary nginx configuration from
    # an Ingress object (CVE-2021-25742).
    
    # Cert-manager for SSL certificates
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Monitoring
    prometheus.io/scrape: "true"
    prometheus.io/port: "10254"
    prometheus.io/path: "/metrics"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cancer-genomics.yourdomain.com  # Change to your domain
    secretName: cancer-genomics-tls
  rules:
  - host: cancer-genomics.yourdomain.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80
---
# Alternative: Ingress for API-only access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cancer-genomics-api-ingress
  namespace: cancer-genomics
  labels:
    app: cancer-genomics-analysis-suite
    component: api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # The controller's own CORS handling, replacing a configuration-snippet
    # (CVE-2021-25742).
    #
    # allow-origin is the UI's origin, not "*". It was "*" alongside an
    # allow-headers list containing Authorization, which told any site on the
    # internet it could send authenticated calls here and read the replies.
    #
    # The wildcard was also self-defeating: ingress-nginx defaults
    # cors-allow-credentials to true, and browsers reject
    # "Access-Control-Allow-Origin: *" together with credentials, so
    # cookie-bearing cross-origin calls were failing anyway.
    #
    # This matches helm/values-production.yaml, which already pins the origin
    # and sets credentials explicitly. Change it with the hosts below; for more
    # than one origin the annotation takes a comma-separated list.
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://cancer-genomics.yourdomain.com"  # Change with the hosts below
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.cancer-genomics.yourdomain.com  # Change to your API domain
    secretName: cancer-genomics-api-tls
  rules:
  - host: api.cancer-genomics.yourdomain.com  # Change to your API domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cancer-genomics-web
            port:
              number: 8050
