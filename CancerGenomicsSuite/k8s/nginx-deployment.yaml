apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: cancer-genomics
  labels:
    app: cancer-genomics-analysis-suite
    component: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      component: nginx
  template:
    metadata:
      labels:
        app: nginx
        component: nginx
    spec:
      # nginx:1.25-alpine ships the `nginx` user as uid 101. Running as
      # that user means the listener has to move above 1024, which is
      # why nginx.conf now says 8080 and the Service targets 8080.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: cancer-genomics
  labels:
    app: cancer-genomics-analysis-suite
    component: nginx
spec:
  selector:
    app: nginx
    component: nginx
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: LoadBalancer  # Change to ClusterIP if using Ingress
