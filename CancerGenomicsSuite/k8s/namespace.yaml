apiVersion: v1
kind: Namespace
metadata:
  name: cancer-genomics
  labels:
    name: cancer-genomics
    app: cancer-genomics-analysis-suite
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cancer-genomics-quota
  namespace: cancer-genomics
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    pods: "20"
    services: "10"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cancer-genomics-limits
  namespace: cancer-genomics
spec:
  limits:
  - default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cancer-genomics-ingress
  namespace: cancer-genomics
spec:
  # Selects every pod in the namespace. Without a policy selecting them the
  # cluster default is to accept traffic from anywhere in the cluster, which
  # is what CKV2_K8S_6 reports against each Deployment here.
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # The tiers talk to each other: web and celery reach postgres, redis and
    # neo4j, and nginx fronts web.
    - from:
        - namespaceSelector:
            matchLabels:
              name: cancer-genomics
    # Prometheus scrapes the workloads from the monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
    # External traffic arrives through the ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
