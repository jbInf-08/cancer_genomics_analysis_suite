<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DNA double helix">
  <g stroke-linecap="round" fill="none">
    <!-- base pairs -->
    <g stroke="#94a3b8" stroke-width="3">
      <line x1="22" y1="12" x2="42" y2="12"/>
      <line x1="25" y1="22" x2="39" y2="22"/>
      <line x1="25" y1="42" x2="39" y2="42"/>
      <line x1="22" y1="52" x2="42" y2="52"/>
    </g>
    <!-- strands -->
    <path d="M20 4 C 20 20, 44 20, 44 32 S 20 44, 20 60" stroke="#6c63ff" stroke-width="5"/>
    <path d="M44 4 C 44 20, 20 20, 20 32 S 44 44, 44 60" stroke="#DE29BE" stroke-width="5"/>
  </g>
</svg>
