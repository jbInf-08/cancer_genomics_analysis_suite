---
# ArgoCD Application for Prometheus
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cancer-genomics-prometheus
  namespace: argocd
  labels:
    app: cancer-genomics-prometheus
    environment: production
    component: monitoring
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cancer-genomics-project
  
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 55.5.0
    helm:
      values: |
        prometheus:
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: fast-ssd
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 100Gi
            resources:
              requests:
                memory: "2Gi"
                cpu: "1000m"
              limits:
                memory: "4Gi"
                cpu: "2000m"
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            additionalScrapeConfigs:
              - job_name: 'cancer-genomics-app'
                static_configs:
                  - targets: ['cancer-genomics-app:8080']
                metrics_path: '/metrics'
                scrape_interval: 30s
        
        grafana:
          enabled: true
          # Credentials come from Secrets, not from this file. adminPassword was
          # "admin", and grafana.ini repeated it under security, so syncing this
          # Application stood up Grafana on a login published in the repository.
          #
          # Create both Secrets before the first sync; Grafana will not start
          # without them, which is the intended failure:
          #
          #   kubectl create secret generic grafana-admin -n monitoring \
          #     --from-literal=admin-user=admin \
          #     --from-literal=admin-password="$(openssl rand -base64 24)"
          #
          #   kubectl create secret generic grafana-oauth -n monitoring \
          #     --from-literal=GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=<from Keycloak>
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # Puts GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET in the pod environment,
          # which grafana.ini reads below through $__env{}.
          envFromSecret: grafana-oauth
          persistence:
            enabled: true
            storageClassName: fast-ssd
            size: 10Gi
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          grafana.ini:
            server:
              root_url: https://grafana.cancer-genomics.yourdomain.com
            # No security section. admin_user/admin_password here would take
            # precedence over the admin.existingSecret above and put the
            # credentials straight back into this file.
            auth.anonymous:
              enabled: false
            auth.oauth_auto_login: true
            auth.generic_oauth:
              enabled: true
              name: "Keycloak"
              client_id: grafana
              # Read from the pod environment, supplied by the grafana-oauth
              # Secret via envFromSecret above. This was the literal string
              # "grafana-secret" -- an OAuth client secret in the repository,
              # which lets anyone holding it complete the Keycloak code
              # exchange as this client.
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: "openid profile email"
              auth_url: https://keycloak.cancer-genomics.yourdomain.com/realms/cancer-genomics/protocol/openid-connect/auth
              token_url: https://keycloak.cancer-genomics.yourdomain.com/realms/cancer-genomics/protocol/openid-connect/token
              api_url: https://keycloak.cancer-genomics.yourdomain.com/realms/cancer-genomics/protocol/openid-connect/userinfo
              role_attribute_path: contains(groups[*], 'grafana-admin') && 'Admin' || contains(groups[*], 'grafana-editor') && 'Editor' || 'Viewer'
        
        alertmanager:
          enabled: true
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: fast-ssd
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "200m"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
---
# ArgoCD Application for ELK Stack
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cancer-genomics-elk
  namespace: argocd
  labels:
    app: cancer-genomics-elk
    environment: production
    component: logging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cancer-genomics-project
  
  source:
    repoURL: https://helm.elastic.co
    chart: elasticsearch
    targetRevision: 8.5.1
    helm:
      values: |
        replicas: 3
        minimumMasterNodes: 2
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeClaimTemplate:
          accessModes: ["ReadWriteOnce"]
          storageClassName: fast-ssd
          resources:
            requests:
              storage: 50Gi
        esJavaOpts: "-Xmx2g -Xms2g"
        esConfig:
          elasticsearch.yml: |
            xpack.security.enabled: false
            xpack.monitoring.collection.enabled: true
            cluster.name: "cancer-genomics"
            node.name: "${HOSTNAME}"
            network.host: 0.0.0.0
            discovery.seed_hosts: "elasticsearch-master-headless"
            cluster.initial_master_nodes: "elasticsearch-master-0,elasticsearch-master-1,elasticsearch-master-2"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
