---
# ArgoCD Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # Server configuration
  server.insecure: "false"
  server.disable.auth: "false"
  server.enable.grpc.web: "true"
  server.enable.proxy.extension: "true"
  server.port: "8080"
  server.grpc.port: "8081"
  server.secure: "true"
  
  # Repository configuration
  reposerver.parallelism.limit: "10"
  reposerver.log.format: "json"
  
  # Controller configuration
  controller.status.processors: "20"
  controller.operation.processors: "10"
  controller.self.heal.timeout.seconds: "5"
  controller.repo.server.timeout.seconds: "60"
  controller.status.hard.limit: "100000"
  controller.operation.hard.limit: "100000"
  
  # Application controller configuration
  application.instanceLabelKey: "argocd.argoproj.io/instance"
  application.instanceLabelValue: "cancer-genomics"
  
  # Resource exclusions
  resource.exclusions: |
    - apiGroups:
        - cilium.io
      kinds:
        - CiliumIdentity
      clusters:
        - "*"
    - apiGroups:
        - cilium.io
      kinds:
        - CiliumEndpoint
      clusters:
        - "*"
    - apiGroups:
        - cilium.io
      kinds:
        - CiliumNode
      clusters:
        - "*"
  
  # Resource inclusions
  resource.inclusions: |
    - apiGroups:
        - kafka.strimzi.io
      kinds:
        - "*"
      clusters:
        - "*"
    - apiGroups:
        - argoproj.io
      kinds:
        - "*"
      clusters:
        - "*"
    - apiGroups:
        - monitoring.coreos.com
      kinds:
        - "*"
      clusters:
        - "*"
  
  # OIDC configuration
  oidc.config: |
    name: OIDC
    issuer: https://keycloak.cancer-genomics.svc.cluster.local:8080/realms/cancer-genomics
    clientId: argocd
    clientSecret: $oidc.clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]
    requestedIDTokenClaims: {"groups": {"essential": true}}
  
  # URL configuration
  url: https://argocd.cancer-genomics.yourdomain.com
  
  # No admin.password here. It carried a bcrypt hash, which is published the
  # moment it is committed -- bcrypt slows an offline guess, it does not stop
  # one, and the hash was fixed for every install of this file.
  #
  # It also did nothing. Argo CD reads admin.password from the argocd-secret
  # Secret, not from a ConfigMap, so the entry never took effect and the
  # password stayed whatever argocd-initial-admin-secret generated. The
  # accompanying admin.passwordMtime is gone with it; Argo CD uses it to expire
  # sessions issued before a password change, and a fixed date is meaningless
  # without the password it refers to.
  #
  # The intended flow is already in DEPLOYMENT_GUIDE.md: read the generated
  # password out of argocd-initial-admin-secret, then change it with
  # `argocd account update-password`, which writes the new hash into
  # argocd-secret where Argo CD actually looks.